# Tiny Tapeout project information
project:
  title:        "Programmable Protocol Emulator"
  author:       "Alex Motea"
  discord:      ""
  description:  "Programmable protocol emulator for UART, SPI and I2C"
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "6x4"

  top_module:  "tt_um_alexmotea2005_protocol_emulator"

  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "A0"
  ui[1]: "A1"
  ui[2]: "A2"
  ui[3]: "A3"
  ui[4]: "A4"
  ui[5]: "A5"
  ui[6]: "A6"
  ui[7]: "A7"

  # Outputs
  uo[0]: "SUM0"
  uo[1]: "SUM1"
  uo[2]: "SUM2"
  uo[3]: "SUM3"
  uo[4]: "SUM4"
  uo[5]: "SUM5"
  uo[6]: "SUM6"
  uo[7]: "SUM7"

  # Bidirectional pins
  uio[0]: "B0"
  uio[1]: "B1"
  uio[2]: "B2"
  uio[3]: "B3"
  uio[4]: "B4"
  uio[5]: "B5"
  uio[6]: "B6"
  uio[7]: "B7"

# Do not change!
yaml_version: 6
