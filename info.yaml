# Tiny Tapeout project information
project:
  title:        "Programmable Protocol Emulator"
  author:       "Alex Motea"
  discord:      ""
  description:  "Programmable protocol emulator for UART, SPI and I2C"
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "6x4"

  top_module:  "tt_um_alexmotea2005_protocol_emulator"

  source_files:
    - "project.v"
    - "uart_tx.v"
    - "uart_rx.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "D0"
  ui[1]: "D1"
  ui[2]: "D2"
  ui[3]: "D3"
  ui[4]: "D4"
  ui[5]: "D5"
  ui[6]: "D6"
  ui[7]: "D7"

  # Outputs
  uo[0]: "TX"
  uo[1]: "BUSY"
  uo[2]: "RX_VALID"
  uo[3]: "RX_ERROR"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "START"
  uio[1]: "RX"
  uio[2]: "ECHO"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6